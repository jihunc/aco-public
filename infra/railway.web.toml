# Standalone Next.js image. Provider keys belong only to explicitly authorized server runtimes.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/web.Dockerfile"

[deploy]
startCommand = "node web/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
