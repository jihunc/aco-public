# No URI suffix on proxy_pass: preserve the original escaped path and query.
# SigV4 signs Host, Authorization, and selected request headers; forward them intact.
proxy_pass http://storage-core:8333;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
proxy_pass_request_headers on;
proxy_request_buffering off;
proxy_buffering off;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
