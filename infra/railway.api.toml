# Local preparation only. Select this path explicitly on the API service after release authorization.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/api.Dockerfile"

[deploy]
preDeployCommand = ["python -m aco.cli migrate"]
startCommand = "python -m aco.cli api"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
