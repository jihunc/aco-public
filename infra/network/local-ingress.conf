# Trusted fixed local ingress only. No HTTP forward proxy, CONNECT, or dynamic target.
# The pinned image includes the stream module in its binary (--with-stream).
worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    access_log off;
    upstream local_postgres {
        server postgres:5432;
    }
    upstream local_oidc {
        server identity:8080;
    }
    server {
        listen 55432;
        proxy_connect_timeout 3s;
        proxy_timeout 300s;
        proxy_pass local_postgres;
    }
    server {
        listen 58080;
        proxy_connect_timeout 3s;
        proxy_timeout 300s;
        proxy_pass local_oidc;
    }
}
